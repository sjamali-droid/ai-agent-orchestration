# ============================================================
# Project Profile — generated by the install wizard
# ============================================================
# Fill every field marked TODO before the orchestrator starts.
# Agents read this file first; incorrect values cause drift.
# ============================================================

project_id: "tasksphere-pro"          # TODO: unique slug, e.g. "acme-ecommerce"
name: "TaskSphere Pro"                # TODO: human-readable project name
description: "A high-performance, team-collaboration task management system featuring RBAC, project-based organization, and rich media attachments."

repos:                                # TODO: list every repo the orchestrator manages
  - name: "tasksphere-backend"        # e.g. "backend-api"
    url: "https://github.com/org/tasksphere-backend"
    default_branch: main
    type: backend                     # backend | frontend | lib
  - name: "tasksphere-frontend"
    url: "https://github.com/org/tasksphere-frontend"
    default_branch: main
    type: frontend

default_message_bus: kafka            # kafka | pubsub — pick one; do not mix without an ADR

kubernetes:
  cluster_context: "gke_tasksphere_us-central1_cluster"
  namespace_dev: tasksphere-dev
  namespace_staging: tasksphere-staging
  namespace_prod: tasksphere-prod

log_shipper: fluent-bit-sidecar       # fluent-bit-sidecar | filebeat-sidecar | daemonset

dapr:
  enabled: true
  control_plane_namespace: dapr-system

# --- Issue tracking: local markdown files in issues/ ---
issue_tracker: local-markdown         # local-markdown | github | jira
issue_tracker_path: issues/           # relative to orchestration root

# --- Context: provided manually by user on request ---
context7:
  mode: manual                        # manual | api
  library_ids: []                     # unused in manual mode

non_goals: []

milestones:                           # TODO: at least one milestone
  - id: m1
    name: "Core RBAC & Project Architecture"
    due_date: "2026-06-01"
  - id: m2
    name: "Task Workflow & Media Uploads"
    due_date: "2026-07-15"
  - id: m3
    name: "Beta Team Launch"
    due_date: "2026-08-30"

# --- Model access via Cursor IDE (no direct API keys required) ---
model_provider: cursor                # cursor | direct-api
models:
  project_manager: claude-opus-4
  software_architect: o3
  developer: claude-sonnet-4
  devsecops: o4-mini
  qa: gemini-2.5-flash
  fallback: claude-sonnet-4

# --- Git workflow ---
git:
  managed_by_agent: true              # agent creates branches, commits locally
  push_to_remote: manual              # manual (user pushes) | auto
  branch_prefix: orchestration/       # e.g. orchestration/feature/user-auth

# --- Local observability ---
elk:
  mode: local-docker                  # local-docker | remote
  elasticsearch_url: http://localhost:9200
  kibana_url: http://localhost:5601