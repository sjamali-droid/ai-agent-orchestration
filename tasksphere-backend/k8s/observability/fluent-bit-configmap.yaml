apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-config
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
    app.kubernetes.io/component: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf
        HTTP_Server   On
        HTTP_Listen   0.0.0.0
        HTTP_Port     2020
        Health_Check  On

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/tasksphere-*.log
        Parser            cri
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     10MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.var.log.containers.
        Merge_Log           On
        Merge_Log_Key       log_processed
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off

    [FILTER]
        Name    grep
        Match   kube.*
        Regex   kubernetes_namespace_name tasksphere-.*

    [FILTER]
        Name          modify
        Match         kube.*
        Add           cluster gke_tasksphere_us-central1_cluster
        Add           project tasksphere-pro

    [OUTPUT]
        Name            es
        Match           kube.*
        Host            elasticsearch.tasksphere-dev.svc.cluster.local
        Port            9200
        Logstash_Format On
        Logstash_Prefix tasksphere-logs
        Retry_Limit     3
        Replace_Dots    On
        Suppress_Type_Name On
        tls             On
        tls.verify      Off
        Trace_Error     On

  parsers.conf: |
    [PARSER]
        Name        cri
        Format      regex
        Regex       ^(?<time>[^ ]+) (?<stream>stdout|stderr) (?<logtag>[^ ]*) (?<log>.*)$
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z

    [PARSER]
        Name        json
        Format      json
        Time_Key    timestamp
        Time_Format %Y-%m-%dT%H:%M:%S.%L%z
