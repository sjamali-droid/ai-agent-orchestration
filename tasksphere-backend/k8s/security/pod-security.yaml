apiVersion: v1
kind: Namespace
metadata:
  name: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: tasksphere-staging
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: tasksphere-prod
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
---
# Reference PodSecurityStandard for TaskSphere workloads.
# All pods must comply with the "restricted" profile:
#   - runAsNonRoot: true
#   - allowPrivilegeEscalation: false
#   - drop ALL capabilities
#   - seccompProfile: RuntimeDefault
#   - readOnlyRootFilesystem recommended
apiVersion: v1
kind: ConfigMap
metadata:
  name: pod-security-baseline
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
data:
  restricted-pod-template.yaml: |
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    containers:
      - securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
              - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - name: tmp
            mountPath: /tmp
    volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
