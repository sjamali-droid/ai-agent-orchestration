apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow all services to resolve DNS (kube-dns)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Allow Dapr sidecar communication within the namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dapr-sidecar
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector:
    matchLabels:
      dapr.io/enabled: "true"
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dapr-system
      ports:
        - protocol: TCP
          port: 3500
        - protocol: TCP
          port: 50001
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: dapr-system
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# All backend services -> PostgreSQL
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-services-to-postgres
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: project-service
        - podSelector:
            matchLabels:
              app: task-service
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - protocol: TCP
          port: 5432
---
# notification-service -> Kafka
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification-to-kafka
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: notification-service
      ports:
        - protocol: TCP
          port: 9092
---
# Producer services -> Kafka (auth, project, task via Dapr pub/sub)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-producers-to-kafka
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: auth-service
        - podSelector:
            matchLabels:
              app: project-service
        - podSelector:
            matchLabels:
              app: task-service
      ports:
        - protocol: TCP
          port: 9092
---
# file-service -> MinIO (S3-compatible storage)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-file-service-to-minio
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector:
    matchLabels:
      app: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: file-service
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9001
---
# Allow ingress to services from frontend / API gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-services
  namespace: tasksphere-dev
  labels:
    app.kubernetes.io/part-of: tasksphere-pro
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - auth-service
          - project-service
          - task-service
          - file-service
          - notification-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3001
        - protocol: TCP
          port: 3002
        - protocol: TCP
          port: 3003
        - protocol: TCP
          port: 3004
        - protocol: TCP
          port: 3005
