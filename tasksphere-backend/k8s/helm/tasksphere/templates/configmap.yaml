apiVersion: v1
kind: ConfigMap
metadata:
  name: tasksphere-config
  namespace: {{ include "tasksphere.namespace" . }}
  labels:
    {{- include "tasksphere.labels" . | nindent 4 }}
data:
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  KAFKA_BROKERS: {{ .Values.config.kafkaBrokers | quote }}
  S3_ENDPOINT: {{ .Values.config.s3Endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3Bucket | quote }}
  ELASTICSEARCH_URL: {{ .Values.config.elasticsearchUrl | quote }}
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
