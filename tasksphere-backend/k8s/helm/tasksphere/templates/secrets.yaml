apiVersion: v1
kind: Secret
metadata:
  name: tasksphere-secrets
  namespace: {{ include "tasksphere.namespace" . }}
  labels:
    {{- include "tasksphere.labels" . | nindent 4 }}
type: Opaque
data:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  MINIO_ACCESS_KEY: {{ .Values.secrets.minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ .Values.secrets.minioSecretKey | quote }}
