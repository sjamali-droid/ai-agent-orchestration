services:
  # =============================================
  # Infrastructure
  # =============================================
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tasksphere
      POSTGRES_PASSWORD: tasksphere
      POSTGRES_DB: tasksphere
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./migrations/001_init_schemas.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasksphere"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:latest
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: tasksphere-local-dev-001
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3 &&
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb local/tasksphere-attachments --ignore-existing
      "

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx256m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.0
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "1025:1025"
      - "8025:8025"

  # =============================================
  # Microservices (all containerized)
  # =============================================
  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://tasksphere:tasksphere@postgres:5432/tasksphere
      JWT_SECRET: docker-dev-secret-change-me
      JWT_ACCESS_EXPIRES_SEC: "900"
      JWT_REFRESH_EXPIRES_SEC: "604800"
      KAFKA_BROKERS: kafka:9092
      AUTH_SERVICE_PORT: "3001"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  project-service:
    build:
      context: .
      args:
        SERVICE_NAME: project-service
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgresql://tasksphere:tasksphere@postgres:5432/tasksphere
      JWT_SECRET: docker-dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
      PROJECT_SERVICE_PORT: "3002"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  task-service:
    build:
      context: .
      args:
        SERVICE_NAME: task-service
    ports:
      - "3003:3003"
    environment:
      DATABASE_URL: postgresql://tasksphere:tasksphere@postgres:5432/tasksphere
      JWT_SECRET: docker-dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
      TASK_SERVICE_PORT: "3003"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3003/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  file-service:
    build:
      context: .
      args:
        SERVICE_NAME: file-service
    ports:
      - "3004:3004"
    environment:
      DATABASE_URL: postgresql://tasksphere:tasksphere@postgres:5432/tasksphere
      JWT_SECRET: docker-dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
      FILE_SERVICE_PORT: "3004"
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: tasksphere-attachments
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3004/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgresql://tasksphere:tasksphere@postgres:5432/tasksphere
      JWT_SECRET: docker-dev-secret-change-me
      KAFKA_BROKERS: kafka:9092
      NOTIFICATION_SERVICE_PORT: "3005"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@tasksphere.local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailhog:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3005/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # =============================================
  # Frontend
  # =============================================
  frontend:
    build:
      context: ../tasksphere-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_AUTH_URL: http://localhost:3001
      NEXT_PUBLIC_PROJECT_URL: http://localhost:3002
      NEXT_PUBLIC_TASK_URL: http://localhost:3003
      NEXT_PUBLIC_FILE_URL: http://localhost:3004
      NEXT_PUBLIC_NOTIFICATION_URL: http://localhost:3005
    depends_on:
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(r=>{if(!r.ok)throw 1}).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pg-data:
  minio-data:
  es-data:
