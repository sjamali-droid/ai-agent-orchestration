openapi: "3.1.0"
info:
  title: notification-service API
  version: "0.1.0"
  description: In-app notifications and user notification preferences

paths:
  /notifications:
    get:
      summary: List notifications for current user
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  total: { type: integer }

  /notifications/unread-count:
    get:
      summary: Get unread notification count
      security: [{ BearerAuth: [] }]
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }

  /notifications/{id}/read:
    patch:
      summary: Mark notification as read
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: Marked as read

  /notifications/read-all:
    patch:
      summary: Mark all notifications as read
      security: [{ BearerAuth: [] }]
      responses:
        "204":
          description: All marked as read

  /users/{id}/preferences:
    get:
      summary: Get notification preferences
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }
    patch:
      summary: Update notification preferences
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email_notifications: { type: boolean }
      responses:
        "200":
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserPreferences" }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        title: { type: string }
        message: { type: string }
        link: { type: string }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }

    UserPreferences:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        email_notifications: { type: boolean }
